[package]
name = "carbonado-node"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[[bin]]
name = "carbonadod"
path = "src/bin/carbonadod.rs"

[features]
default = []
neon = ["blake3/neon"]
rayon = ["blake3/rayon"]

[dependencies]
anyhow = "1.0.75"
axum = "0.7.2"
axum-macros = "0.4.0"
bao = "0.13"
blake3 = "1.5.0"
bytes = "1.5.0"
# Carbonado 0.7.0 on crates.io. default-features off: this node is a
# library consumer (encode/decode + Header). pqc/cli/ots pull bitcoinpqc CMake.
# See [crates.io carbonado 0.7.0](https://crates.io/crates/carbonado/0.7.0)
# (accessed: 2026-08-27).
carbonado = { version = "0.7.0", default-features = false, features = ["backend-rust", "parallel"] }
chrono = "0.4.31"
clap = { version = "4.4.11", features = ["derive"] }
directories = "5.0.1"
file-format = { version = "0.24.0", features = ["reader-xml"] }
flexi_logger = { version = "0.27.4", features = ["colors"] }
flexi_syslog = "0.5.3"
futures-util = "0.3.29"
http = "1.0.0"
log = "0.4.20"
nom = "7.1.3"
nostr = "0.44"
par-stream = { version = "0.10.2", features = ["runtime-tokio"] }
percent-encoding = "2.3.1"
rand = "0.8.5"
rayon = "1.8.0"
secp256k1 = { version = "0.28.0", features = [
    "global-context",
    "rand-std",
    "serde",
] }
serde = { version = "1.0.193", features = ["derive"] }
serde_cbor = "0.11.2"
syslog = "6.1.0"
thiserror = "1.0.50"
tokio = { version = "1.34.0", features = ["full"] }
toml = "0.8.8"
tower-http = { version = "0.5.0", features = ["cors"] }
